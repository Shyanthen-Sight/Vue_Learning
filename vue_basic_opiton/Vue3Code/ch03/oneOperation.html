    <title>一则运算</title>

<body>
</body>
<script>
    function fourOpt(op, ...data) {
        if (op === "+") {
            let result = 0;
            for (let i = 0; i < data.length; i++) {
                result += data[i];
            }
            console.log(result);
        } else if (op === "-") {
            let result = 0;
            for (let i = 0; i < data.length; i++) {
                result -= data[i];
            }
            console.log(result);
        } 
    }
    fourOpt("-", 1, 2, 3, 4, 5)
</script>
