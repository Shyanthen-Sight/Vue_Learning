    <title>let与块级作用域</title>

<body>
</body>
<script>
    // 块级作用域
    function cube(flag) {
        if (flag) {
            let a = 10;
            var b = 1;
        } 
        console.log(b);
        console.log(a);
    }
    console.log(cube(true))

</script>
