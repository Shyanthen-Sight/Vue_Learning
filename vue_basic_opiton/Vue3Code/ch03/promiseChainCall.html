<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promise的链式调用</title>
</head>
<body>
    
</body>
<script>
    const incremental=new Promise((resolve,reject)=>{
        resolve(1);
        console.log("promise:传入初始化value值");
    });
    incremental.then(value=>{
        console.log("first then:",value);
        return value+1;
    }).then(value=>console.log("second then:",value))
</script>
</html>
