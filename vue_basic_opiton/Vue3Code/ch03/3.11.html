<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展开运算符</title>
</head>
<body>
    
</body>
<script>
    // ES5中应用Math.max()
    function test(){
        let arr=[1,2,3,4,5];
        console.log(Math.max.apply(Math,arr))
    } 
    test();
    //ES6中应用Math.max()
    function test2(){
        let arr=[1,2,3,4,5];
        console.log(Math.max(...arr))
    } 
    test2();


</script>
</html>
