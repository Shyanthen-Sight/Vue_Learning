<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>async函数</title>
</head>
<body>
    
</body>
<script>
    async function showMessage(){
        return "新疆和田大枣";
    }
    // 等价于
    // function sum(num1,num2){
    //     return Promise.resolve(num1+num2);
    // }
    console.log(showMessage());//Promise{'新疆和田大枣'}
    showMessage().then(value=>{console.log(value);})//新疆和田大枣

</script>
</html>
