<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>组合式API中的依赖注入</title>
</head>
<body>
<div id='app'>
    <h1>组合式API中的依赖注入</h1>
    <parent></parent>
</div>
<script src='https://unpkg.com/vue@next'></script>
<script>
    const {reactive ,provide ,inject} =Vue
    // 根组件
    const vm = Vue.createApp({
        setup(){
            const product={
                    name:"水晶葡萄",price:28.90,stock:999,
                    detail:{
                        barnd:"哒哒",
                        type:"水晶葡萄",
                        bunmber:123456,
                        placeProduction:"贵州",
                        storageConditions:"冷藏",
                    }
                };
            //提供给子组件的数据
            provide('productProvide',reactive(product))
        }
    })
    //父组件
    vm.component('parent',{
        template:` <child></child>`
    })
    // 子组件
    vm.component('child',{
        setup(){
            //子组件接收来自父组件的数据
            const productProvide=inject('productProvide')
            return {productProvide}
        },
        template:`
        <h3>{{productProvide.name}}</h3>
        <p>当前价格：{{productProvide.price}}</p>
        <p>库存：{{productProvide.stock}}</p>
        <hr>
        <div>
            <ul>
                <li v-for="(value,key) in productProvide.detail" :key="key">{{key}}:{{value}}</li>
            </ul>
        </div>`
    })
    // 挂载根组件
    vm.mount('#app')
</script>
</body>
