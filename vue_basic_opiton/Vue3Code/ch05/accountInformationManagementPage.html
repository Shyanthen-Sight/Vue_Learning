<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <title>账户信息管理页面</title>
</head>
<style>
    [v-cloak] {
        display: none;
    }

    .accountBox {
        width: 500px;
        height: 400px;
        box-shadow: 0px 0px 10px 4px gainsboro;
        margin: 0 auto;
        margin-top: 4%;
    }

    .accountBox h1 {
        font-family: 'Courier New', monospace;
        font-weight: 600;
        text-align: center;
        height: 60px;
        line-height: 60px;
        color: black;
        box-shadow: 0px 15px 10px -15px gainsboro;

    }

    ul {
        margin: 0 20px;
        padding: 0 0;
    }

    /* 列表项 */
    li {
        list-style: none;
        height: 50px;
        line-height: 80px;
        font-weight: 600;
        font-size: 20px;
        font-family: 'Times New Roman', Times, serif;
        border-bottom: 1px solid gainsboro;
        margin-bottom: 20px;
        line-height: 50px;
        padding: 0 5px;
        box-sizing: border-box;
    }

    /* 单行文本框样式 */
    input[type="text"],
    input[type="password"] {
        width: 80%;
        height: 30px;
        border-radius: 4px;
        border: 1px solid #c8cccf;
        color: #6a6f77;
        padding-top: 5px;
    }

    /* 确认信息样式 */
    .sure {
        color: #6a6f77;
        font-size: 16px;
    }

    /* 提交样式 */
    button {
        width: 100%;
        height: 100%;
        color: #fff;
        background: #e2231a;
        border: 0;
        text-align: center;
    }
</style>

<body>
    <div id='app' v-cloak>
        <div class="accountBox">
            <h1>{{msg}}</h1>
            <form  @submit.prevent="handleSubmit">
                <ul>
                    <li>
                        <label for="username">账户：</label>
                        <span v-show="!userFlag" @click.once="editUser">{{username}}</span>
                        <input v-show="userFlag" v-model="username" @keypress.enter="overUser" type="text"
                            id="username">
                    </li>
                    <li>
                        <label for="password">密码：</label>
                        <span v-show="!pwdFlag" @click="editPwd">{{passwordFilter}}</span>
                        <input v-show="pwdFlag" v-model="password" @keypress.enter="overPwd" type="text" id="password">
                    </li>
                    <li>
                        <input type="checkbox" name="agreement" id="agreement" @click="handleDisabled">
                        <label for="agreement" class="sure">确认信息无误</label>
                    </li>
                    <li>
                    <button @click="submit" id="submitBtn" :disabled="isDisabled">提交</button>
                    </li>
                </ul>
            </form>
        </div>
    </div>
    <script src='https://unpkg.com/vue@next'></script>
    <script>
        const vm = Vue.createApp({
            data() {
                return {
                    msg: '账户管理',
                    username: "admin",
                    password: "123456",
                    pwdFlag: false,
                    userFlag: false,
                    isDisabled: true,
                }
            },
            methods: {
                // 阻止表单的默认提交事件
                handleSubmit() {
                    console.log("阻止form表单的默认事件");
                },
                // 编辑账户信息
                editUser() {
                    this.userFlag = true;
                },
                // 完成账号修改触发的事件
                overUser() {
                    console.log("账户修改完成");
                    this.userFlag = false;
                },
                // 控制密码编辑按钮与密码文本框的交叉显示
                editPwd() {
                    this.pwdFlag = true;
                },
                // 密码修改完成触发本方法
                overPwd() {
                    console.log("密码修改完成");
                    this.pwdFlag = false;
                },
                  // 控制协议的选中与否
                  handleDisabled(event) {
                    if (event.target.checked==true) {
                        this.isDisabled = false;
                    } else {
                        this.isDisabled = true;
                    }
                },
                //提交信息
                submit(){
                    alert("用户信息存储成功");
                }
            },
            //计算属性
            computed: {
                passwordFilter() {
                    let len = this.password.length;
                    return this.password.replace(this.password.substring(2, len - 2), "***")
                }
            }
        }).mount('#app')
    </script>
</body>
