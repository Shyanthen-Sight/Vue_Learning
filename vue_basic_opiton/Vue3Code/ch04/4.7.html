<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>不使用key属性</title>
</head>
<body>
<div id="app">
    <div>名称:<input type="text" v-model="names"></div>
    <div>产地:<input type="text" v-model="citys"></div>
    <button v-on:click="add()">add</button>
    <hr>
    <p v-for="item in proList" v-bind:key="item.name">
    <input type="checkbox">
    <span>名称:{{item.name}},产地:{{item.city}}</span>
   </p>
</div>
<!--引入vue文件-->
<script src="../../vue.js"></script>
    <script>
        //创建一个应用程序实例
        const vm = Vue.createApp({
            data() {
                return {
                    names: "",
                    citys: "",
                    proList: [
                        {name: '鸭梨',city: '北京' },
                        {name: '花牛苹果', city: '甘肃' },
                        {name: '松茸',city: '云南'}
                    ]
                }
            },
            methods: {
                add() {
                    this.proList.unshift({
                        name: this.names,
                        city: this.citys,
                    })
                    this.names="",
                    this.citys=""
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
