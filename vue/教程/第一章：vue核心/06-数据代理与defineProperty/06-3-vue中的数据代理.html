<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script type="text/javascript" src="../js/vue.js"></script>
</head>
<body>
  <div id="root">
    <h1>学校名称：{{ name }}</h1>
    <h1>学校地址：{{ address }}</h1>
  </div>
  <script >
    Vue.config.productionTip = false
    const vm = new Vue({
      el: '#root',
      data:{
          name: '清华大学',
          address: '北京市海淀区'
      }
    })
  </script>
</body>
</html>
