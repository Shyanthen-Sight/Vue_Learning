<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
  <div id="app">
    <h1>天气预报</h1>
    <p>今天天气很{{ weather }}</p>
    <button @click="changeWeather">切换天气</button>
    <hr>
    <p>数字a:{{ numbers.a }}</p>
    <button @click="numbers.a++">增加a</button>
    <p>数字b:{{ numbers.b }}</p>
    <button @click="numbers.b++">增加b</button>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        ishot: true,
        numbers: {
          a: 1,
          b: 1
        }
      },

      computed: {
        weather() {
          return this.ishot ? '炎热' : '凉爽';
        }
      },
      methods: {
        changeWeather() {
          this.ishot = !this.ishot;
        }
      },
      watch: {
        ishot: {
          immediate: true, // 立即执行
          handler(newValue, oldValue) {
            console.log('weather发生了变化', newValue, oldValue)
          }
        },

        numbers: {
          deep: true, // 深度监听
          handler() {
            console.log('numbers发生了变化')
          }
        }
      },
      
    });
  </script>
</body>

</html>
