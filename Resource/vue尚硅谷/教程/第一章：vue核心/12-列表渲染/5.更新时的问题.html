<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3.列表过滤</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      padding: 20px;
    }

    input {
      padding: 6px 10px;
      width: 220px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin: 6px 0;
    }
  </style>
</head>

<body>
  <div id="root">
    <h2>人员列表</h2>
    <button @click="updatamei">更新马冬梅信息</button>
    <ul>
      <!-- 遍历的是计算属性 filPersons，不是原数组 persons -->
      <li v-for="p in persons" :key="p.id">
        {{p.name}}-{{p.age}}-{{p.gender}}
      </li>
    </ul>
  </div>

  <script>
    const vm = new Vue({
      el: "#root",
      data: {
   
        keyWord: '',  // 搜索关键字
        persons: [    // 原始数据（永远不被改动）
          { id: '001', name: '马冬梅', age: 30, gender: '女' },
          { id: '002', name: '周杰伦', age: 18, gender: '男' },
          { id: '003', name: '周星驰', age: 45, gender: '男' },
          { id: '004', name: '温兆伦', age: 22, gender: '男' }
        ]
      },
      methods: {
        // 更新马冬梅的信息
        updatamei() {
          // 方式一：直接修改对象的属性值
            // this.persons[0].name = '马冬梅2.0';
            // this.persons[0].age = 18;
            // this.persons[0].gender = '女';
          // 方式二：直接替换对象
            this.persons[0] = { id: '001', name: '马冬梅2.0', age: 18, gender: '女' }
        }
      }
    


    })
  </script>
</body>

</html>
