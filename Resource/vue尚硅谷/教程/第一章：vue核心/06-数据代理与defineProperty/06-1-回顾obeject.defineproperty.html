<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let person1 = {
      name: '王五',
      sex: '男',
      age: 20
    }
    console.log(person1)

    let person2 = {
      name: '张三',
      sex: '男'
    }

    Object.defineProperty(person2, 'age', {
      value: 18,
      enumerable: true, // 可枚举
      writable: true, // 可写
      configurable: true, // 可配置
      
      get() {
        console.log('有人读取age属性')
      },

      set() {
        console.log('有人修改age属性')
      }
    })
    console.log(person2)



  </script>
</body>

</html>
