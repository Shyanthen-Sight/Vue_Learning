<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
  <div id="app">
    <h1>天气预报</h1>
    <p>今天天气很{{ weather }}</p>
    <button @click="changeWeather">切换天气</button>

  </div>

  <script>
    const vm = new Vue({
      el: '#app',
      data: {
        ishot: true
      },

      computed: {
        weather() {
          return this.ishot ? '炎热' : '凉爽';
        }
      },

      methods: {
        changeWeather() {
          this.ishot = !this.ishot;
        }
      },

      watch: {
        // 正常写法
        // ishot: {
        //   // immediate: true, // 立即执行
        //   // deep: true, // 深度监听
        //   handler(newValue, oldValue) {
        //     console.log('weather发生了变化', newValue, oldValue)
        //   }


        //简写
        ishot(newValue, oldValue){
          console.log('weather发生了变化', newValue, oldValue)
        }

        },
      

    });
  </script>
</body>

</html>
