<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- 使用CDN，告别本地路径问题 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>
  <div id="root">
    姓：<input type="text" placeholder="请输入姓氏" v-model="firstName"><br>
    名：<input type="text" placeholder="请输入名字" v-model="lastName"><br>
    姓名：{{ getFullName() }}
  </div>

  <script>
    
    Vue.config.productionTip = false
    const vm = new Vue({
      el: '#root',
      data: {
        firstName: '',
        lastName: ''
      },
      methods: {
        getFullName() {
          return this.firstName + this.lastName
        }
      }
    })
  </script>
</body>
</html>
