<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>
  <div id="app">
    <nihao></nihao>
    <hr>  
    <xuexiao></xuexiao>
    <hr>
    <xuesheng></xuesheng>
  </div>

  <script>
    // 1. 先定义组件
    const school = Vue.extend({
      template: `
      <div>
        <h2>学校信息</h2>
        <p>学校名称：{{name}}</p>
        <p>学校地址：{{address}}</p>
        <button @click="showName">提示学校名称</button>
      </div>`,
      data() {
        return {
          name: '清华大学',
          address: '北京市海淀区'
        }
      },
      methods:{
        showName(){
          alert(this.name)
        }
      }
    })

    const student = Vue.extend({
      template: `
      <div>
        <h2>学生信息</h2>
        <p>学生姓名：{{name}}</p>
        <p>学生年龄：{{age}}</p>
      </div>`,
      data() {
        return {
          name: '张三',
          age: 18
        }
      }
    })

    const hello=Vue.extend({
      template:`
      <div>
        <h2>hello,{{name}}</h2>
      </div>`,
      data(){
        return {
          name:"xu"
        }
      }
    })

    // 2. 再创建 Vue 实例使用它们
    new Vue({
      el: '#app',
      components: {
        xuexiao: school,
        xuesheng: student,
        nihao:hello
      }
    })
  </script>
</body>
</html>
