<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
  <div id="root">
    <school></school>
  </div>
  <script>
    const school = Vue.extend({
      name: 'school',
        template:`
        <div>
          <h2>学校信息</h2>
          <p>学校名称：{{name}}</p>
          <p>学校地址：{{address}}</p>
        </div>  
        `,
        data(){
          return {
            name:'清华大学',
            address:'北京市海淀区'
          }
        }
    })

    new Vue({
      el: '#root',
      components: {
        school
      }
    })
  </script>
</body>

</html>
