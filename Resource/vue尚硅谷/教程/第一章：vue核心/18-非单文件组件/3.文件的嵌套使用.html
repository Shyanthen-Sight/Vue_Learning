<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
  <div id="app">
    <app></app>
  </div>
  <script>
    //定义学生组件（先定义子组件）
    const student = Vue.extend({
      template: `
      <div>
        <h2>学生信息</h2>
        <p>学生姓名：{{name}}</p>
        <p>学生年龄：{{age}}</p>
      </div>`,
      data() {
        return {
          name: '张三',
          age: 18
        }
      }
    })
    //定义学校组件
    const school = Vue.extend({
      template: `
      <div>
        <h2>学校信息</h2>
        <p>学校名称：{{name}}</p>
        <p>学校地址：{{address}}</p>
        <button @click="showName">提示学校名称</button>
        <student></student>
      </div>`,
      data() {
        return {
          name: '清华大学',
          address: '北京市海淀区'
        }
      },
      methods: {
        showName() {
          alert(this.name)
        }
      },
      components: {
        student
      }
    })
    //定义hello组件
    const hello = Vue.extend({
      template:`
      <div>
        <h2>hello,{{smg}}</h2>
      </div>`,
      data() {
        return {
          smg: '欢迎学习vue'
        }
      }
    })
    //定义app组件
    const app = Vue.extend({
      template: `
      <div>
        <hello></hello>
        <school></school>
      </div>
      `,
      components: {
        hello,
        school
      }
    })
    
    //创建vue实例
    new Vue({
      el: '#app',
      components: {
        app
      }
    })
  </script>

</body>

</html>
