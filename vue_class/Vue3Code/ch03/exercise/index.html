<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品订单页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        li {
            list-style: none;
        }

        html {
            background-color: #EAE8EB;
            padding-top: 4vh;
            padding-bottom: 4vh;
        }

        .shop-list {
            background-color: #fff;
            margin: 0 auto;
            width: 80%;
            height: 92vh;
            border-radius: 10px;
        }

        .list-container {
            display: none;
        }

        .shop-tab {
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #E8E8E8;
            line-height: 80px;
        }

        .check-tab {
            color: red;
            border-bottom: 2px solid red;

        }

        .list-title {
            line-height: 50px;
            display: flex;
            justify-content: space-between;
            background-color: #F5F5F5;
            /* padding: 0 50px 0 30px; */
        }

        .list-title li {
            width: 20%;
            text-align: center;
        }

        .list-style {
            display: flex;
            justify-content: space-between;
        }

        .list-style li {
            width: 20%;
            text-align: center;
            line-height: 50px;
            border-bottom: 1px solid #E8E8E8;
        }

        .page {
            width: 100%;
            display: flex;
            justify-content: end;
            /* font-size: 12px; */
        }

        .container {
            width: 20%;
            display: flex;
            margin-top: 50px;
        }

        .left {
            margin: 0 20px 0 20px;
            color: #B8B8B8;
        }

        .center {
            border: 1px solid blue;
            border-radius: 5px;
            width: 24px;
            text-align: center;
            color: blue;
        }

        .right {
            margin: 0 20px 0 20px;
            color: #000;
        }

        .all {
            border: 1px solid #B8B8B8;
            border-radius: 5px;
            width: 66px;
            text-align: center;
            background-color: #F5F5F5;
            color: #B8B8B8;
        }

        #loadPicture {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            text-align: center;
        }

        #loadPicture .load-picture {
            width: 120px;
            height: 100px;
            margin: 0 auto;
        }
        #list {
            display: none;
        }
    </style>
</head>

<body>
    <div class="shop-list">
        <!-- 商品订单tab -->
        <div class="shop-tab">
            <div>用户信息</div>
            <span class="check-tab" id="0">普通用户</span>
            <span id="1">白金用户</span>
            <span id="2">全部用户</span>
        </div>
        <!-- 表格title -->
        <div>
            <ul class="list-title">
                <li>用户ID</li>
                <li>用户名称</li>
                <li>账户余额</li>
                <li>联系方式</li>
                <li>购买次数</li>
            </ul>
            <ul id="list">
            </ul>
        </div>
        <div id="loadPicture">
            <img src="./loding.gif" alt="" class="load-picture" id="load">
        </div>
    </div>
    <script type="module">
        //导入所需参数
        import { normalList, vipList } from './module.js';
        //获取list dom节点，动态渲染列表
        let listDom = document.getElementById('list');
        //获取tab列表dom，设置事件监听
        let tabContainer = document.getElementsByClassName('shop-tab');
        let tab = document.querySelectorAll('span');
        //获取list包裹dom/load图标dom
        let load = document.getElementById('load');
        let timer = null;
        // 初始化render
        render(normalList);
        // tab切换方法
        for (let i = 0; i < tab.length; i++) {
            tab[i].onclick = function () {
                asyncRender()
                for (let i = 0; i < tab.length; i++) {
                    tab[i].className = '';
                }
                if (i == 0) {
                    render(normalList);
                } else if (i == 1) {
                    render(vipList);
                } else if (i == 2) {
                    render(normalList, vipList);
                }
                this.className = 'check-tab';
            }
        }
        // 动态渲染列表方法
        function render(...rest) {
            const newArr = rest.length > 1 ? [...rest[0], ...rest[1]] : rest[0];
            listDom.innerHTML = '';
            newArr.forEach((item) => {
                let divContainer = window.document.createElement('div');
                let childLi = `
        <li>${item.id}</li>    
        <li>${item.username}</li>    
        <li>${item.money}</li>    
        <li>${item.tel}</li>    
        <li>${item.frequency}</li>    `;
                divContainer.innerHTML = childLi;
                divContainer.setAttribute('class', 'list-style');
                listDom.appendChild(divContainer);
            })
        }

        // 异步加载
        function loading(list) {
            return new Promise(resolve => {
                timer = setTimeout(() => {
                    load.style.display = 'none'
                    listDom.style.display = 'block'
                }, 3000)
            })

        }
        //点击延迟加载样式
        function asyncRender(){
            load.style.display = 'block'
            listDom.style.display = 'none'
            init()
        }   
        //初始化延迟样式
        async function init() {
            await loading();
            //清楚定时器
            timer = null;
        }
        init()
    </script>
</body>

</html>
