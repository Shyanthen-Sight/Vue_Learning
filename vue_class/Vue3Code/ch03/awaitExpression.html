<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>await表达式</title>
</head>
<body>
    
</body>
<script>
    function delayed(){//异步操作
        return new Promise(resolve=>{
            setTimeout(()=>{
                console.log("延时1000ms");
                resolve();
            },1000)
        })
    }
    async function delayedAsync(){//表示函数里有异步操作
        await delayed();//await后面的表达式需要等待结果
        console.log("greeting");
    }
    delayedAsync();
</script>
</html>
