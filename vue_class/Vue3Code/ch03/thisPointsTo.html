    <title>箭头函数与this指向</title>
</head>
<body>
</body>
<script>
        var obj={
            message:'Welcome',
            greeting:function(){
                console.log(this);
                var message='Hello';
                var objects={
                    message:'你好',
                    say:()=>{console.log(this.message);}
                }
                objects.say();
            }
        }
        obj.greeting();
</script>
