<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <title>值绑定的单一复选框</title>
</head>
<body>
    <div id='app'>
        <h1>值绑定的单一复选框</h1>
        <input type="checkbox" v-model="isSave" :true-value="saved" :false-value="unSaved" id="informationStorage">
        <label for="informationStorage">记住账号与密码</label>
        <p>isSave:{{isSave}}</p>
    </div>
    <script src='https://unpkg.com/vue@next'></script>
    <script>
        const vm = Vue.createApp({
            data() {
                return {
                    isSave: '空',
                    saved:'记住',
                    unSaved:'未记住'
                }
            }
        }).mount('#app')
    </script>
</body>
