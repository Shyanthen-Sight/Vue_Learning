<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>单行文本输入框</title>
</head>
<body>
    <div id='app'>
        <h1>单行文本输入框</h1>
        <input type="text" value="Hello" v-model="message">
        <p>message:{{message}}</p>
    </div>
    <script src='https://unpkg.com/vue@next'></script>
    <script>
        const vm = Vue.createApp({
            data() {
                return {
                    message: '欢迎进入系统'
                }
            }
        }).mount('#app')
    </script>
</body>
