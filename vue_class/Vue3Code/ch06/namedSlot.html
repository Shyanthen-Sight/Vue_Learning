<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <title>具名插槽</title>
</head>

<body>
    <div id='app'>
        <h3>具名插槽</h3>
        <poetry>
            <template v-slot:title><h3>行路难·其一</h3></template>
            <template #author><p>李白</p></template>
            <template v-slot:default>
                <div>
                    行路难，行路难，多岐路，今安在？
                </div>
                <div>
                    长风破浪会有时，直挂云帆济沧海。
                </div>
            </template>
        </poetry>
    </div>
    <script src='https://unpkg.com/vue@next'></script>
    <script>
        const vm = Vue.createApp({})
        vm.component('poetry', {
            template: `
            <div>
              <slot name="title"></slot>
              <slot name="author"></slot>
              <slot></slot>
            </div>`
        })
        vm.mount('#app')
    </script>
</body>
