<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>prop校验</title>
</head>
<body>
    <div id='app'>
        <h1>prop校验</h1>
        <parent></parent>
    </div>
    <script src='https://unpkg.com/vue@next'></script>
    <script>
        const vm = Vue.createApp({});
        //子组件
        const Child = {
            props: {
                //基础类型校验,null和undefined会通过任何类型的校验
                id: Number,
                //必填性验证
                name: {
                    type: [String,Number],//多类型
                    required:true
                },
                //默认值设置
                sex:{
                    type:String,
                    default:'男'
                },
                //自定义验证函数
                loginMethod:{
                    validator:function(value){
                        return ['Tel','QQ','WeChat'].indexOf(value) !==-1
                    }
                }
            },
            template:`<p>{{id}}-{{name}}-{{sex}}-{{loginMethod}}</p>`
        }
        vm.component('Parent', {
            components: {
                Child
            }, //注册子组件
            data() {
                return {
                    id: 001, //类型校验
                    name: "小明", //必填
                    sex: undefined, //默认值
                    loginMethod: 'Tel' //自定义验证
                }
            },
            template: `<Child :id="id" :name="name" :sex="sex" :login-method="loginMethod"></Child>`
        })
        vm.mount('#app')
    </script>
</body>
