<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>自定义过渡类名</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>
<body>
<div id='app'>
    <h1>自定义过渡类名</h1>
    <button @click="show = !show">《小池》</button>
    <!-- button按钮控制元素的显式与隐藏 -->
    <!-- animate__animated是Animate.css动画库的公共类名 -->
    <!-- animate__bounceInUp是动画名称类 -->
    <transition  enter-active-class="animate__animated animate__bounceInUp"
        leave-active-class="animate__animated animate__zoomOutDown">
        <!-- enter-active-class控制动画的进入效果 -->
        <!-- leave-active-class控制动画的离开效果 -->
        <div v-if="show">
            泉眼无声惜细流，树阴照水爱晴柔。<br>
            小荷才露尖尖角，早有蜻蜓立上头。
        </div>
    </transition>
</div>
<script src='https://unpkg.com/vue@next'></script>
<script>
    const vm = Vue.createApp({
        data() {
            return {
                show: true
            }
        }
    }).mount('#app')
</script>
</body>
